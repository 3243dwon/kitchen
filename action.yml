name: kitchen gates
description: Run the repo's own gates with the base verify CLI — the same file this Mac runs from ~/.claude/kitchen.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '22'
    - name: Install node dependencies
      shell: bash
      run: |
        if [ -f package-lock.json ]; then npm ci
        elif [ -f package.json ]; then npm install
        else echo 'no package.json'; fi
    - name: Detect python
      id: py
      shell: bash
      run: |
        if [ -f pyproject.toml ] || [ -f requirements.txt ]; then echo 'yes=true' >> "$GITHUB_OUTPUT"; fi
    - if: steps.py.outputs.yes == 'true'
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'
    - if: steps.py.outputs.yes == 'true'
      name: Install python dependencies
      shell: bash
      run: |
        if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install -e .; fi
        pip install pytest ruff
    - name: Gates
      shell: bash
      run: node "$GITHUB_ACTION_PATH/verify.mjs" gates
